function suggestion(name,target){
  const t=trackingFor(name),last=lastSets(name);
  if(t==='time'){
    if(!last)return `Empieza en ${target.secondsMin||20}-${target.secondsMax||60} segundos con técnica sólida.`;
    const best=Math.max(...last.sets.map(s=>Number(s.seconds||0)));
    return `Anterior: hasta ${best} s. Suma 5 s cuando completes todas las series con buena técnica.`;
  }
  if(t==='reps'){
    if(!last)return `Empieza conservador dentro de ${target.repsMin}-${target.repsMax} repeticiones.`;
    const best=Math.max(...last.sets.map(s=>Number(s.reps||0)));
    return `Anterior: hasta ${best} reps. Intenta sumar repeticiones manteniendo control.`;
  }
  if(!last)return 'Empieza conservador: busca el RIR objetivo con técnica limpia.';
  const work=last.sets.filter(s=>!s.warmup&&s.weight>0);
  if(!work.length)return 'Usa una carga cómoda y ajusta por RIR.';
  const maxRep=Math.max(...work.map(s=>s.reps));const minRir=Math.min(...work.map(s=>s.rir??9));const same=work.every(s=>s.weight===work[0].weight);
  if(same&&work.every(s=>s.reps>=target.repsMax)&&minRir>=target.rir)return `Puedes probar un pequeño aumento sobre ${work[0].weight} kg.`;
  if(maxRep<target.repsMin)return `Mantén o baja ligeramente desde ${work[0].weight} kg hasta entrar en ${target.repsMin}-${target.repsMax} reps.`;

function renderTrain(pref){
  const w=currentWeek();
  let rn=pref||(activeSession?.routine)||(isStrengthActivity(routineToday())?routineToday():nextStrengthSession()?.routine)||'Torso A';
  if(!['Torso A','Pierna A','Torso B','Pierna B'].includes(rn))rn='Torso A';
  if(completedToday(rn)){activeSession=null;state.activeDraft=null;save();currentView='inicio';nav();renderHome();return}
  if(!activeSession||activeSession.date!==localDate()||activeSession.routine!==rn)makeDraft(rn,w);
  const p=draftProgress();
  document.getElementById('main').innerHTML=`<div class="grid"><section class="card c12"><div class="row space"><div><div class="eyebrow">Semana ${w}</div><div class="h1" style="font-size:28px">Entrenamiento</div><div class="muted">Guardado automático · ${p?p.done:0}/${p?p.total:0} series completadas</div></div><div class="row"><select class="btn" onchange="makeDraft(this.value,${w});renderTrain()">${routineOptions(activeSession.routine)}</select><button class="btn ghost" onclick="discardDraft()">Cancelar</button><button class="btn primary" onclick="saveSession(false)">Finalizar sesión</button></div></div><div class="notice ${weekData(w).type==='Descarga'?'warn':''}">${weekData(w).type==='Descarga'?'<b>Semana de descarga.</b> Menos series y RIR 4.':'Cada cambio se guarda automáticamente. Al completar la última serie, el entrenamiento se finalizará solo.'}</div><div style="margin-top:14px">${activeSession.exercises.map((e,i)=>exerciseEditor(e,i)).join('')}</div></section></div>`
}
function makeDraft(rn,w){
  if(state.activeDraft&&state.activeDraft.date===localDate()&&state.activeDraft.routine===rn){activeSession=state.activeDraft;return}
  const r=weekData(w).routines[rn];
  activeSession={id:'local-'+Date.now(),date:localDate(),routine:rn,startedAt:new Date().toISOString(),exercises:r.map(x=>{
    const actual=effectiveExercise(x.exercise),tracking=trackingFor(actual);
    return {original:x.exercise,exercise:actual,target:x,tracking,sets:Array.from({length:x.sets},()=>tracking==='time'?({seconds:'',done:false,warmup:false}):tracking==='reps'?({reps:'',rir:x.rir,done:false,warmup:false}):({weight:'',reps:'',rir:x.rir,done:false,warmup:false}))}
  })};
  persistDraft();
}
function exerciseEditor(e,i){
  const prev=lastSets(e.exercise),tracking=e.tracking||trackingFor(e.exercise);
  const prevHtml=prev?`<div class="prev">Anterior (${prev.date}): ${prev.sets.filter(x=>!x.warmup).map(x=>setLabel(e.exercise,x)).join(' / ')}</div>`:'';
  let labels='',rows='';
  if(tracking==='time'){
    labels='<div class="setrow labels"><span></span><span style="grid-column:span 3">segundos</span><span>✓</span></div>';
    rows=e.sets.map((s,j)=>`<div class="setrow"><span class="setnum">${j+1}</span><input style="grid-column:span 3" type="number" min="1" step="1" inputmode="numeric" value="${s.seconds||''}" oninput="updSet(${i},${j},'seconds',this.value)"><input class="check" type="checkbox" ${s.done?'checked':''} onchange="updSet(${i},${j},'done',this.checked)"></div>`).join('');
  }else if(tracking==='reps'){
    labels='<div class="setrow labels"><span></span><span style="grid-column:span 2">reps</span><span>RIR</span><span>✓</span></div>';
    rows=e.sets.map((s,j)=>`<div class="setrow"><span class="setnum">${j+1}</span><input style="grid-column:span 2" type="number" min="1" step="1" inputmode="numeric" value="${s.reps||''}" oninput="updSet(${i},${j},'reps',this.value)"><input type="number" min="0" max="5" step="1" value="${s.rir??''}" oninput="updSet(${i},${j},'rir',this.value)"><input class="check" type="checkbox" ${s.done?'checked':''} onchange="updSet(${i},${j},'done',this.checked)"></div>`).join('');
  }else{
    labels='<div class="setrow labels"><span></span><span>kg</span><span>reps</span><span>RIR</span><span>✓</span></div>';
    rows=e.sets.map((s,j)=>`<div class="setrow"><span class="setnum">${j+1}</span><input type="number" step="0.5" inputmode="decimal" value="${s.weight??''}" oninput="updSet(${i},${j},'weight',this.value)"><input type="number" step="1" value="${s.reps??''}" oninput="updSet(${i},${j},'reps',this.value)"><input type="number" min="0" max="5" step="1" value="${s.rir??''}" oninput="updSet(${i},${j},'rir',this.value)"><input class="check" type="checkbox" ${s.done?'checked':''} onchange="updSet(${i},${j},'done',this.checked)"></div>`).join('');
  }
  return `<div class="exercise"><div class="exercise-head"><div><h3>${i+1}. ${esc(e.exercise)} ${e.exercise!==e.original?`<span class="tag">sustituye ${esc(e.original)}</span>`:''}</h3><div class="target">${targetLabel(e.exercise,e.target)}</div></div><button class="btn small" onclick="openSwap(${i})">No puedo hacerlo</button></div>${prevHtml}<div class="suggest">${esc(suggestion(e.exercise,e.target))}</div><div class="sets">${labels}${rows}</div></div>`;
}
function persistDraft(){
  state.activeDraft=activeSession?clone(activeSession):null;
  save();
  scheduleCloudSave(250);
}
function draftIsComplete(){
  return !!activeSession&&activeSession.exercises.every(e=>e.sets.every(s=>{const t=e.tracking||trackingFor(e.exercise);return s.done&&(t==='time'?Number(s.seconds)>0:Number(s.reps)>0)}));
}
function updSet(i,j,k,v){
  activeSession.exercises[i].sets[j][k]=k==='done'?v:(v===''?'':Number(v));
  persistDraft();
  if(draftIsComplete())saveSession(true);
}
function discardDraft(){
  if(confirm('¿Cancelar esta sesión? Se borrará el progreso guardado de hoy.')){
    activeSession=null;state.activeDraft=null;save();go('inicio');
  }
}
function saveSession(auto=false){
  if(!activeSession)return;
  const exs=activeSession.exercises.map(e=>{
    const t=e.tracking||trackingFor(e.exercise);
    const sets=e.sets.filter(s=>s.done&&(t==='time'?Number(s.seconds)>0:Number(s.reps)>0)).map(s=>{
      if(t==='time')return {seconds:Number(s.seconds),warmup:false};
      if(t==='reps')return {reps:Number(s.reps),rir:Number(s.rir??e.target.rir??0),failure:Number(s.rir)===0,warmup:false};
      return {weight:Number(s.weight||0),reps:Number(s.reps),rir:Number(s.rir),failure:Number(s.rir)===0,warmup:false};
    });
    return {exercise:e.exercise,tracking:t,sets};
  }).filter(e=>e.sets.length);
  if(!exs.length){if(!auto)alert('Marca al menos una serie como completada.');return}
  if(!state.sessions.some(s=>s.id===activeSession.id)){
    state.sessions.push({id:activeSession.id,date:activeSession.date,routine:`S${currentWeek()} - ${activeSession.routine}`,startedAt:activeSession.startedAt,endedAt:new Date().toISOString(),exercises:exs,source:'Rafa Gym 12'});
  }
  state.activeDraft=null;activeSession=null;save();
  currentView='inicio';nav();renderHome();
}
function openSwap(i){const e=activeSession.exercises[i],def=state.exercises.find(x=>x.name===e.exercise)||state.exercises.find(x=>x.name===e.original);const alts=[...(def?.alternatives||[])];const same=state.exercises.filter(x=>def&&x.pattern===def.pattern&&x.name!==e.exercise&&!alts.includes(x.name)).map(x=>x.name);const opts=[...alts,...same].slice(0,8);showModal(`<h2 class="h2">Sustituir ${esc(e.exercise)}</h2><div class="muted">Elige un movimiento equivalente. Si el motivo es dolor, no fuerces el ejercicio doloroso y valora asesoramiento profesional si persiste.</div><div class="field"><label>Motivo</label><select id="swapReason"><option>Máquina/equipo no disponible</option><option>Molestia o dolor</option><option>Ejercicio ocupado</option><option>No sé ejecutarlo con seguridad</option><option>Otro</option></select></div><div class="field"><label>Sustituto</label><select id="swapReplacement">${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Aplicar</label><select id="swapScope"><option value="today">Solo hoy</option><option value="future">Desde ahora en todo el plan</option></select></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="applySwap(${i})">Aplicar cambio</button></div>`)}
function applySwap(i){const original=activeSession.exercises[i].original,replacement=document.getElementById('swapReplacement').value,reason=document.getElementById('swapReason').value,scope=document.getElementById('swapScope').value,t=trackingFor(replacement);activeSession.exercises[i].exercise=replacement;activeSession.exercises[i].tracking=t;activeSession.exercises[i].sets=activeSession.exercises[i].sets.map(s=>t==='time'?({seconds:s.seconds||s.reps||'',done:s.done||false,warmup:false}):t==='reps'?({reps:s.reps||'',rir:s.rir??activeSession.exercises[i].target.rir,done:s.done||false,warmup:false}):({weight:s.weight||'',reps:s.reps||'',rir:s.rir??activeSession.exercises[i].target.rir,done:s.done||false,warmup:false}));state.substitutions.push({date:localDate(),original,replacement,reason,scope});state.issues.push({date:localDate(),exercise:original,reason,replacement});persistDraft();closeModal();renderTrain()}
function renderHistory(){const ss=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date));const exNames=[...new Set(state.sessions.flatMap(s=>s.exercises.map(e=>e.exercise)))].sort();document.getElementById('main').innerHTML=`<div class="grid"><section class="card c8"><div class="row space"><div><div class="eyebrow">Tus marcas</div><div class="h1" style="font-size:28px">Historial</div></div><select class="btn" id="chartEx" onchange="drawProgress(this.value)"><option value="">Elige ejercicio para gráfico</option>${exNames.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><canvas id="chart" width="900" height="220"></canvas></section><section class="card c4"><h2 class="h2">Mejores marcas estimadas</h2>${exNames.map(n=>{const b=bestForExercise(n);return b?`<div class="row space" style="margin:8px 0"><span>${esc(n)}</span><span class="record good">${b.weight}×${b.reps}</span></div>`:''}).filter(Boolean).slice(0,8).join('')||'<div class="empty">Sin marcas</div>'}</section><section class="card c12"><h2 class="h2">Sesiones</h2>${ss.map(s=>`<details class="plan-week"><summary>${esc(s.date)} · ${esc(s.routine)} · ${s.exercises.reduce((a,e)=>a+e.sets.length,0)} series</summary><div class="plan-body">${s.exercises.map(e=>`<div class="history-item"><div class="row space"><b>${esc(e.exercise)}</b><span class="tag">${e.sets.length} series</span></div><div class="muted" style="margin-top:5px">${e.sets.map(x=>`${setLabel(e.exercise,x)}`).join(' &nbsp; | &nbsp; ')}</div></div>`).join('')}</div></details>`).join('')}</section></div>`;drawProgress('')}
function drawProgress(name){const c=document.getElementById('chart');if(!c)return;const ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0e1216';ctx.fillRect(0,0,W,H);if(!name){ctx.fillStyle='#7f8a95';ctx.font='16px system-ui';ctx.fillText('Selecciona un ejercicio para ver su progresión.',28,45);return}const pts=[];for(const s of [...state.sessions].sort((a,b)=>a.date.localeCompare(b.date))){const e=s.exercises.find(x=>x.exercise===name);if(!e)continue;const best=e.sets.filter(x=>x.weight&&x.reps).map(x=>({e1:x.weight*(1+x.reps/30),w:x.weight,r:x.reps})).sort((a,b)=>b.e1-a.e1)[0];if(best)pts.push({date:s.date,...best})}if(!pts.length)return;const vals=pts.map(p=>p.e1),min=Math.min(...vals)*.95,max=Math.max(...vals)*1.05||1;ctx.strokeStyle='#28303a';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=28+i*(H-56)/4;ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(W-20,y);ctx.stroke()}ctx.strokeStyle='#79d18b';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{const x=36+(pts.length===1?0:i*(W-70)/(pts.length-1));const y=H-28-(p.e1-min)/(max-min||1)*(H-56);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#b8f1c4';pts.forEach((p,i)=>{const x=36+(pts.length===1?0:i*(W-70)/(pts.length-1));const y=H-28-(p.e1-min)/(max-min||1)*(H-56);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9da8b4';ctx.font='12px system-ui';ctx.fillText(p.date.slice(5),Math.max(6,x-24),H-8);ctx.fillStyle='#b8f1c4'});}
function renderPlan(){const w=currentWeek();document.getElementById('main').innerHTML=`<div class="grid"><section class="card c8"><div class="eyebrow">Estructura</div><div class="h1" style="font-size:28px">Plan de 12 semanas</div><div class="muted">Semanas 4, 8 y 12 son de descarga. Las sustituciones permanentes se aplican automáticamente al entrenar.</div><div class="sep"></div>${state.plan.map(x=>`<details class="plan-week ${x.week===w?'current':''}" ${x.week===w?'open':''}><summary>Semana ${x.week} · ${x.type} · RIR ${x.rir}</summary><div class="plan-body">${Object.entries(x.routines).map(([rn,it])=>`<div class="plan-routine"><b>${rn}</b>${it.map(e=>{const eff=effectiveExercise(e.exercise),t=trackingFor(eff),target=t==='time'?`${e.sets}×${e.secondsMin||20}-${e.secondsMax||60} s`:t==='reps'?`${e.sets}×${e.repsMin}-${e.repsMax} reps`:`${e.sets}×${e.repsMin}-${e.repsMax} · RIR ${e.rir}`;return `<div>${esc(eff)} · ${target}${eff!==e.exercise?` <span class="tag">antes: ${esc(e.exercise)}</span>`:''}</div>`}).join('')}</div>`).join('')}</div></details>`).join('')}</section><section class="card c4"><h2 class="h2">Sustituciones permanentes</h2>${state.substitutions.filter(x=>x.scope==='future').length?state.substitutions.filter(x=>x.scope==='future').map(x=>`<div class="history-item"><b>${esc(x.original)}</b><div class="muted">→ ${esc(x.replacement)}</div><div class="muted">${esc(x.reason)}</div></div>`).join(''):'<div class="empty">Ninguna todavía.</div>'}<div class="notice" style="margin-top:15px">Si una sustitución es por dolor, la app la registra pero no intenta diagnosticar la causa.</div></section></div>`}
function renderSettings(){document.getElementById('main').innerHTML=`<div class="grid"><section class="card c6"><div class="eyebrow">Nube</div><div class="h1" style="font-size:28px">Sincronización</div><div class="muted">La base de datos es la fuente principal. El navegador conserva una caché para que puedas terminar una sesión aunque pierdas cobertura.</div><div class="row" style="margin-top:18px"><button class="btn primary" onclick="manualSync()">Sincronizar ahora</button><button class="btn" onclick="signOutCloud()">Cerrar sesión</button></div><div class="sep"></div><div class="notice">${cloudUser?`Acceso protegido con PIN en este dispositivo`:'Sin sesión'}</div></section><section class="card c6"><h2 class="h2">Plan</h2><div class="field"><label>Fecha de inicio</label><input type="date" value="${esc(state.profile.planStart)}" onchange="state.profile.planStart=this.value;save();renderSettings()"></div><div class="notice">Convención: barra = peso total con barra. Mancuerna = peso de una sola mancuerna.</div><div class="sep"></div><div class="muted">Datos migrados de Lastries: ${state.sessions.filter(x=>x.source==='Lastries').length} sesiones útiles. Alimentación excluida.</div></section><section class="card c12"><h2 class="h2">Incidencias / ejercicios que no puedes hacer</h2>${state.issues.length?`<table class="table"><thead><tr><th>Fecha</th><th>Ejercicio</th><th>Motivo</th><th>Cambio</th></tr></thead><tbody>${state.issues.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.exercise)}</td><td>${esc(x.reason)}</td><td>${esc(x.replacement)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aún no has marcado ningún problema.</div>'}</section><section class="card c12"><details><summary style="cursor:pointer;font-weight:800">Copia manual de emergencia</summary><div class="row" style="margin-top:14px"><button class="btn" onclick="exportBackup()">Descargar copia</button><label class="btn">Importar copia<input class="hide" type="file" accept="application/json" onchange="importBackup(this.files[0])"></label></div><div class="muted" style="margin-top:8px">Normalmente no tendrás que usar esto: es solo una copia de emergencia.</div></details></section></div>`}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBackup(){download(`rafa-gym-backup-${localDate()}.json`,state)}
function exportForChatGPT(){const compact={app:'Rafa Gym 12',date:localDate(),planStart:state.profile.planStart,currentWeek:currentWeek(),sessions:state.sessions,substitutions:state.substitutions,issues:state.issues,request:'Revisa mis marcas e incidencias, actualiza las sustituciones que hagan falta y mantén la progresión del plan de 12 semanas.'};download(`rafa-gym-para-chatgpt-${localDate()}.json`,compact)}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.profile||!x.plan||!x.sessions)throw new Error('Formato no reconocido');state=x;save();alert('Copia importada.');go('inicio')}catch(e){alert('No se pudo importar: '+e.message)}};r.readAsText(file)}
function resetApp(){if(confirm('Esto restaurará los datos iniciales también en la nube. ¿Continuar?')){state=clone(INITIAL_DATA);save();go('inicio')}}
function showModal(x){document.getElementById('modalBody').innerHTML=x;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});initCloud();
</script></body></html>
